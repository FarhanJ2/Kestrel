# Production deployment on the Raspberry Pi: docker compose up -d --build
services:
  kestrel:
    build:
      context: .
      target: runtime
    image: kestrel:latest
    restart: unless-stopped
    # Reap/forward signals so `docker compose stop` shuts down immediately
    init: true
    # SocketCAN interfaces (including CANivore) live in the host network namespace
    network_mode: host
    cap_add:
      - NET_ADMIN
