name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit on a branch needs a result
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native arm64 runner: same architecture as the Raspberry Pi, no emulation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the exact image that gets deployed to the Pi (Release, Debian bookworm, arm64)
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: kestrel:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check shared libraries resolve
        run: |
          missing=$(docker run --rm kestrel:latest ldd /usr/local/bin/Kestrel | grep "not found" || true)
          if [[ -n "$missing" ]]; then
            echo "$missing"
            exit 1
          fi

      # No CAN bus or controller in CI: the program should start and keep running until the timeout
      - name: Smoke test
        run: |
          docker run --rm --init kestrel:latest timeout 10s Kestrel \
            || ( [[ $? -eq 124 ]] && echo "Program started successfully" )

      - name: Check compose file
        run: docker compose config --quiet

      - name: Extract binary
        run: |
          id=$(docker create kestrel:latest)
          docker cp "$id":/usr/local/bin/Kestrel ./Kestrel
          docker rm "$id"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-linux-arm64-${{ github.sha }}
          path: Kestrel
          retention-days: 14
